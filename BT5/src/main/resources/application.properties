# ===== BT5 - Spring Boot 4 + JSP/JSTL =====
spring.application.name=BT5

server.port=8080
server.servlet.context-path=/BT5
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# View JSP. File nam trong src/main/webapp/WEB-INF/views/
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ===== Database MySQL =====
# createDatabaseIfNotExist=true giup tu tao database khi chay lan dau.
spring.datasource.url=jdbc:mysql://localhost:3306/bt5crud?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Mac dinh Spring Boot doi ten cot camelCase thanh snake_case (categoryId -> category_id),
# lam lech schema so voi BT3/BT4 va file database.sql. Dung strategy chuan de ten cot
# dung y nguyen nhu khai bao trong @Column, giu tuong thich nguoc.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Tat open-in-view de tranh giu EntityManager suot request.
spring.jpa.open-in-view=false

# ===== Upload anh =====
# Mac dinh Spring Boot gioi han multipart 1MB/request 10MB, trong khi giao dien bao 5MB.
# Nang gioi han len cho khop voi thong bao tren form.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Thu muc luu anh, nam ngoai webapp de khong bi truy cap truc tiep.
bt5.upload.dir=${user.home}/bt5_upload

# ===== SMTP (chi dung cho chuc nang OTP cua BT3/BT4, BT5 khong bat buoc) =====
# Cau hinh qua bien moi truong hoac -Dbt5.smtp.*, khong hardcode mat khau.

logging.level.org.springframework.web=INFO
