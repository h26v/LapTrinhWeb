<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Dang nhap')}"></head>
<body class="auth-page">
<div class="auth-card">
    <h1>IOTSTAR SHOP</h1>
    <h2>Dang nhap</h2>

    <div class="alert error" th:if="${param.error}">Email hoac mat khau khong dung.</div>
    <div class="alert success" th:if="${param.logout}">Ban da dang xuat.</div>

    <form th:action="@{/login}" method="post">
        <label>Email</label>
        <input type="email" name="email" required autofocus>

        <label>Mat khau</label>
        <input type="password" name="password" required>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <button class="btn primary full" type="submit">Dang nhap</button>
    </form>
</div>
</body>
</html>
