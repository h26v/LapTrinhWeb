<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head(${mode == 'create' ? 'Them Product' : 'Sua Product'})}"></head>
<body>
<div th:replace="~{layouts/layout :: page(~{::main})}">
    <main>
        <h1 th:text="${mode == 'create' ? 'Them Product' : 'Sua Product'}"></h1>

        <form th:object="${productDTO}"
              th:with="actionUrl=${mode == 'create' ? '/products/create' : '/products/edit/' + productDTO.id}"
              th:action="${actionUrl}" method="post" enctype="multipart/form-data" accept-charset="UTF-8">

            <input type="hidden" th:field="*{id}">

            <div>
                <label for="name">Ten san pham</label>
                <input id="name" type="text" th:field="*{name}">
                <small class="error-text" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
            </div>

            <div>
                <label for="description">Mo ta</label>
                <textarea id="description" th:field="*{description}" rows="5"></textarea>
            </div>

            <div>
                <label for="price">Gia</label>
                <input id="price" type="number" step="0.01" th:field="*{price}">
                <small class="error-text" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></small>
            </div>

            <div>
                <label for="image">Anh</label>
                <input id="image" type="file" name="image" accept="image/*">
            </div>

            <div th:if="${productDTO.imageUrl != null}">
                <img th:src="${#strings.substringBefore(productDTO.imageUrl, '|')}" class="preview">
            </div>

            <div>
                <button type="submit" class="button">Luu</button>
                <a class="button secondary" th:href="@{/products}">Huy</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
