<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Dat lai mat khau')}"></head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post">
            <h1>Dat lai mat khau</h1>
            <div th:if="${success}" class="alert success" th:text="${success}"></div>
            <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
                <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
            </div>

            <label>Email</label>
            <input type="email" th:field="*{email}" required>

            <label>OTP</label>
            <input name="otp" maxlength="6" required>

            <label>Mat khau moi</label>
            <input type="password" th:field="*{password}" required>

            <label>Xac nhan mat khau</label>
            <input type="password" th:field="*{confirmPassword}" required>

            <button class="button full" type="submit">Doi mat khau</button>
        </form>
    </div>
</div>
</body>
</html>
