<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head(${mode == 'create' ? 'Them User' : 'Sua User'})}"></head>
<body>
<div th:replace="~{layouts/layout :: page(~{::main})}">
    <main>
        <form th:object="${userDTO}" method="post" enctype="multipart/form-data" accept-charset="UTF-8"
              th:action="${mode == 'create'} ? @{/users/create} : @{/users/edit/{id}(id=${userDTO.id})}">
            <h1 th:text="${mode == 'create' ? 'Them User' : 'Sua User'}"></h1>

            <label>Username</label>
            <input th:field="*{username}">
            <small class="error-text" th:errors="*{username}"></small>

            <label>Email</label>
            <input type="email" th:field="*{email}">
            <small class="error-text" th:errors="*{email}"></small>

            <label>Ho ten</label>
            <input th:field="*{fullName}">
            <small class="error-text" th:errors="*{fullName}"></small>

            <label>Role</label>
            <select th:field="*{roleName}">
                <option value="ROLE_USER">USER</option>
                <option value="ROLE_ADMIN">ADMIN</option>
            </select>

            <label><input type="checkbox" th:field="*{enabled}"> Enabled</label>

            <button class="button">Luu</button>
            <a class="button secondary" th:href="@{/users}">Huy</a>
        </form>

        <p th:if="${mode == 'create'}" class="note">Mat khau mac dinh cua user do Admin tao: <b>123456</b>.</p>
    </main>
</div>
</body>
</html>
