# ===== BT6 - Spring Boot 4 + Thymeleaf + Thymeleaf Layout Dialect =====
spring.application.name=BT6

server.port=8088
server.servlet.context-path=/BT6
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
# Chi dung cookie cho session, tranh URL bi gan ;jsessionid=... sau redirect
server.servlet.session.tracking-modes=cookie

# ===== Thymeleaf =====
# Template nam trong src/main/resources/templates/, duoi .html
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
# Tat cache de sua template khong can khoi dong lai (moi truong phat trien)
spring.thymeleaf.cache=false

# ===== Database MySQL =====
# createDatabaseIfNotExist=true giup tu tao database khi chay lan dau.
spring.datasource.url=jdbc:mysql://localhost:3306/bt6crud?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Giu ten cot dung nhu @Column (categoryId, categoryname) giong BT5,
# thay vi bi Spring Boot doi sang snake_case (category_id).
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

# ===== Upload anh =====
# Mac dinh Spring Boot chi cho 1MB; nang len cho khop thong bao 5MB tren form.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Thu muc luu anh, nam ngoai project de khong bi ghi de khi build lai.
bt6.upload.dir=${user.home}/bt6_upload

# Thong tin sinh vien hien thi o header/footer nam trong student.properties (UTF-8).
