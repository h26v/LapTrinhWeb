<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Tieu de trang con + tieu de layout, vi du: "Danh sách danh mục | BT6" -->
    <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE">BT6</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- HEADER: tai su dung fragment, chua anh sinh vien -->
<header th:replace="~{admin/fragments/header :: header}"></header>

<!-- CONTENT: moi trang con dien vao layout:fragment="content" -->
<main class="container flex-grow-1 py-4">
    <div th:replace="~{admin/fragments/messages :: messages}"></div>
    <section layout:fragment="content">
        <p>Nội dung trang</p>
    </section>
</main>

<!-- FOOTER: tai su dung fragment, chua thong tin sinh vien -->
<footer th:replace="~{admin/fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Script rieng cua tung trang (neu co) -->
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
