<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout-admin}">
<head>
    <title>Danh sách danh mục</title>
</head>
<body>
<section layout:fragment="content">
    <div class="card">
        <div class="card-header d-flex align-items-center">
            <h1 class="h5 mb-0 me-auto"><i class="bi bi-tags"></i> Danh sách danh mục</h1>
            <span class="badge text-bg-secondary"
                  th:text="${categoryPage.totalElements} + ' danh mục'">0 danh mục</span>
        </div>
        <div class="card-body">
            <!-- Tim kiem + them moi -->
            <div class="row g-2 mb-3">
                <div class="col-md-8">
                    <form th:action="@{/admin/categories/searchpaginated}" method="get" class="input-group">
                        <input type="hidden" name="size" th:value="${categoryPage.size}">
                        <input type="text" class="form-control" name="name" th:value="${name}"
                               placeholder="Nhập từ khóa để tìm theo tên danh mục" aria-label="Từ khóa">
                        <button class="btn btn-outline-primary" type="submit"><i class="bi bi-search"></i> Tìm</button>
                        <a th:if="${!#strings.isEmpty(name)}" class="btn btn-outline-secondary"
                           th:href="@{/admin/categories/searchpaginated(size=${categoryPage.size})}">Bỏ lọc</a>
                    </form>
                </div>
                <div class="col-md-4 text-md-end">
                    <a class="btn btn-success" th:href="@{/admin/categories/add}">
                        <i class="bi bi-plus-lg"></i> Thêm danh mục
                    </a>
                </div>
            </div>

            <div th:if="${!#strings.isEmpty(name)}" class="text-muted small mb-2">
                Kết quả tìm kiếm cho "<strong th:text="${name}">từ khóa</strong>"
            </div>

            <!-- Khong co du lieu -->
            <div th:unless="${categoryPage.hasContent()}" class="alert alert-warning mb-0">
                Không tìm thấy danh mục nào.
            </div>

            <!-- Bang du lieu -->
            <div th:if="${categoryPage.hasContent()}" class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th style="width: 60px">STT</th>
                        <th style="width: 90px">ID</th>
                        <th style="width: 90px">Ảnh</th>
                        <th>Tên danh mục</th>
                        <th style="width: 130px">Trạng thái</th>
                        <th style="width: 170px" class="text-end">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="category, iStat : ${categoryPage.content}">
                        <td th:text="${categoryPage.number * categoryPage.size + iStat.count}">1</td>
                        <td th:text="${category.categoryId}">1</td>
                        <td>
                            <img th:unless="${#strings.isEmpty(category.images)}" class="thumb"
                                 th:src="@{/image(fname=${category.images})}" th:alt="${category.categoryName}">
                            <span th:if="${#strings.isEmpty(category.images)}" class="thumb thumb-empty"><i class="bi bi-image"></i></span>
                        </td>
                        <td th:text="${category.categoryName}">Tên</td>
                        <td>
                            <span th:if="${category.status == 1}" class="badge text-bg-success">Hoạt động</span>
                            <span th:unless="${category.status == 1}" class="badge text-bg-secondary">Ẩn</span>
                        </td>
                        <td class="text-end text-nowrap">
                            <a class="btn btn-sm btn-outline-info" title="Xem"
                               th:href="@{/admin/categories/view/{id}(id=${category.categoryId})}"><i class="bi bi-eye"></i></a>
                            <a class="btn btn-sm btn-outline-warning" title="Sửa"
                               th:href="@{/admin/categories/edit/{id}(id=${category.categoryId})}"><i class="bi bi-pencil"></i></a>
                            <button type="button" class="btn btn-sm btn-outline-danger" title="Xóa"
                                    data-bs-toggle="modal" data-bs-target="#confirmDelete"
                                    th:data-id="${category.categoryId}"
                                    th:data-name="${category.categoryName}"><i class="bi bi-trash"></i></button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Chon so dong/trang + phan trang -->
        <div class="card-footer" th:if="${categoryPage.totalElements > 0}">
            <div class="row g-2 align-items-center">
                <div class="col-md-4">
                    <form th:action="@{/admin/categories/searchpaginated}" method="get"
                          class="d-flex align-items-center gap-2">
                        <input type="hidden" name="name" th:value="${name}">
                        <label for="size" class="text-nowrap small">Số dòng/trang</label>
                        <select id="size" name="size" class="form-select form-select-sm w-auto"
                                onchange="this.form.submit()">
                            <option th:each="s : ${pageSizes}" th:value="${s}" th:text="${s}"
                                    th:selected="${s == categoryPage.size}">5</option>
                        </select>
                    </form>
                </div>
                <div class="col-md-8">
                    <nav aria-label="Phân trang" th:if="${categoryPage.totalPages > 1}">
                        <ul class="pagination pagination-sm justify-content-md-end mb-0">
                            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{/admin/categories/searchpaginated(name=${name},size=${categoryPage.size},page=1)}">Đầu</a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                                <a class="page-link" aria-label="Trước"
                                   th:href="@{/admin/categories/searchpaginated(name=${name},size=${categoryPage.size},page=${currentPage - 1})}">&laquo;</a>
                            </li>
                            <li class="page-item" th:each="pageNumber : ${pageNumbers}"
                                th:classappend="${pageNumber == currentPage} ? 'active'">
                                <a class="page-link" th:text="${pageNumber}"
                                   th:href="@{/admin/categories/searchpaginated(name=${name},size=${categoryPage.size},page=${pageNumber})}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == categoryPage.totalPages} ? 'disabled'">
                                <a class="page-link" aria-label="Sau"
                                   th:href="@{/admin/categories/searchpaginated(name=${name},size=${categoryPage.size},page=${currentPage + 1})}">&raquo;</a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == categoryPage.totalPages} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{/admin/categories/searchpaginated(name=${name},size=${categoryPage.size},page=${categoryPage.totalPages})}">Cuối</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
            <div class="small text-muted mt-2"
                 th:text="|Trang ${currentPage}/${categoryPage.totalPages} · Tổng ${categoryPage.totalElements} danh mục|">
                Trang 1/1
            </div>
        </div>
    </div>

    <!-- Hop thoai xac nhan xoa (Bootstrap 5, khong can jQuery). Xoa bang POST. -->
    <div class="modal fade" id="confirmDelete" tabindex="-1" aria-labelledby="confirmDeleteLabel" aria-hidden="true">
        <div class="modal-dialog">
            <form class="modal-content" method="post" id="deleteForm"
                  th:attr="data-base=@{/admin/categories/delete/}">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="confirmDeleteLabel">Xác nhận xóa</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                </div>
                <div class="modal-body">
                    Bạn có chắc muốn xóa danh mục "<strong id="deleteName"></strong>"?
                    <!-- Giu lai trang/tu khoa hien tai de quay ve sau khi xoa -->
                    <input type="hidden" name="name" th:value="${name}">
                    <input type="hidden" name="page" th:value="${currentPage}">
                    <input type="hidden" name="size" th:value="${categoryPage.size}">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-danger">Xóa</button>
                </div>
            </form>
        </div>
    </div>
</section>

<th:block layout:fragment="scripts">
    <script>
        // Dien id/ten danh muc vao hop thoai khi bam nut xoa.
        document.getElementById('confirmDelete').addEventListener('show.bs.modal', function (event) {
            const button = event.relatedTarget;
            const form = document.getElementById('deleteForm');
            form.action = form.dataset.base + encodeURIComponent(button.dataset.id);
            document.getElementById('deleteName').textContent = button.dataset.name;
        });
    </script>
</th:block>
</body>
</html>
