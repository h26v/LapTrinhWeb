<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout-admin}">
<head>
    <title>Chi tiết danh mục</title>
</head>
<body>
<section layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card" th:object="${category}">
                <div class="card-header">
                    <h1 class="h5 mb-0">Chi tiết danh mục</h1>
                </div>
                <div class="card-body">
                    <div class="row g-4">
                        <div class="col-sm-5">
                            <img th:if="${!#strings.isEmpty(category.images)}" class="preview w-100"
                                 th:src="@{/image(fname=*{images})}" th:alt="*{categoryName}">
                            <div th:if="${#strings.isEmpty(category.images)}" class="preview-empty">
                                <i class="bi bi-image fs-1"></i>
                                <div class="small">Chưa có ảnh</div>
                            </div>
                        </div>
                        <div class="col-sm-7">
                            <dl class="row mb-0">
                                <dt class="col-5">ID</dt>
                                <dd class="col-7" th:text="*{categoryId}">1</dd>
                                <dt class="col-5">Tên danh mục</dt>
                                <dd class="col-7" th:text="*{categoryName}">Tên</dd>
                                <dt class="col-5">Trạng thái</dt>
                                <dd class="col-7">
                                    <span th:if="*{status == 1}" class="badge text-bg-success">Hoạt động</span>
                                    <span th:unless="*{status == 1}" class="badge text-bg-secondary">Ẩn</span>
                                </dd>
                            </dl>
                        </div>
                    </div>
                </div>
                <div class="card-footer d-flex gap-2">
                    <a class="btn btn-warning" th:href="@{/admin/categories/edit/{id}(id=*{categoryId})}">
                        <i class="bi bi-pencil"></i> Sửa
                    </a>
                    <a class="btn btn-outline-secondary" th:href="@{/admin/categories/searchpaginated}">Quay lại</a>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
